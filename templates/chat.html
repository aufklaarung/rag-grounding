<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Chat RAG</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> <!--Adding marked.js for Markdown displa-->
</head>
<body>
  <h1>💬 Chat RAG avec Grounding</h1>

  <div id="chat-box"></div>

  <form id="chat-form">
    <textarea id="user-input" placeholder="Pose ta question..." rows="1" required></textarea>
    <button type="submit">Envoyer</button>
  </form>

  <script>
    const form = document.getElementById("chat-form");
    const input = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");
    const textarea = document.getElementById('user-input');
    let isTyping = false;

    // Auto-expand textarea height
    textarea.addEventListener('input', () => {
      textarea.style.height = 'auto';
      textarea.style.height = `${textarea.scrollHeight}px`;
    });

    // Enter to submit, Shift+Enter for newline
    textarea.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit'));
      }
    });

    //  Simulate typing effect
  async function typeResponse(markdownText, container) {
    container.innerHTML = ""; // reset
    const tempText = document.createElement("div");
    container.appendChild(tempText);

    let i = 0;
    const interval = setInterval(() => {
      tempText.innerText = markdownText.slice(0, i++);
      chatBox.scrollTop = chatBox.scrollHeight;

      if (i > markdownText.length) {
        clearInterval(interval);
        container.innerHTML = marked.parse(markdownText);
      }
    }, 10); // adjust speed here
  }

    form.onsubmit = async (e) => {
      e.preventDefault();
      const userMessage = input.value.trim();
      if (!userMessage) return;

      // Display user message
      const userDiv = document.createElement("div");
      userDiv.className = "user-message";
      userDiv.innerHTML = `<strong>Vous:</strong> ${userMessage}`;
      chatBox.appendChild(userDiv);

      input.value = "";
      input.style.height = "auto";

      // Placeholder "typing"
      const assistantDiv = document.createElement("div");
      assistantDiv.className = "assistant-message";
      assistantDiv.textContent = "Assistant est en train d’écrire...";
      chatBox.appendChild(assistantDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userMessage })
        });
        const data = await res.json();

        if (data.response) {
          await typeResponse(data.response, assistantDiv);
        } else {
          assistantDiv.innerHTML = `<div class="error">Erreur : ${data.error}</div>`;
        }
      } catch (err) {
        assistantDiv.innerHTML = `<div class="error">Erreur de communication avec le serveur.</div>`;
      }
    };
  </script>
</body>
</html>
